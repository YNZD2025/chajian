<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一念职达助手</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <!-- 未登录状态 -->
        <div id="login-view" class="view">
            <header class="popup-header">
                <div class="logo">🎯</div>
                <h2>一念职达助手</h2>
                <p class="slogan">AI赋能求职,一键直达理想Offer</p>
            </header>

            <main class="popup-content">
                <div class="login-section">
                    <p class="login-tip">请选择登录方式</p>

                    <!-- 邮箱登录表单 -->
                    <div id="email-login" class="login-form">
                        <div class="input-group">
                            <input type="email" id="login-email" placeholder="邮箱地址" class="login-input">
                        </div>
                        <div class="input-group">
                            <input type="password" id="login-password" placeholder="验证码" class="login-input">
                        </div>
                        <div class="login-options">
                            <label class="remember-me">
                                <input type="checkbox" id="remember-me">
                                <span>记住我</span>
                            </label>
                        </div>
                        <button id="email-login-btn" class="btn primary">
                            <span class="icon">✉️</span>
                            验证码登录
                        </button>
                    </div>

                    <!-- 注册表单 -->
                    <div id="register-form" class="login-form" style="display: none;">
                        <div class="input-group">
                            <input type="email" id="reg-email" placeholder="邮箱地址" class="login-input">
                        </div>
                        <div class="input-group">
                            <input type="password" id="reg-password" placeholder="密码" class="login-input">
                        </div>
                        <div class="input-group">
                            <input type="text" id="reg-verification-code" placeholder="邮箱验证码" class="login-input">
                        </div>
                        <div class="input-group">
                            <input type="text" id="reg-nickname" placeholder="昵称（可选）" class="login-input">
                        </div>
                        <button id="send-code-btn" class="btn secondary">
                            <span class="icon">📧</span>
                            发送验证码
                        </button>
                        <button id="register-btn" class="btn primary">
                            <span class="icon">📝</span>
                            注册账号
                        </button>
                    </div>

                    <!-- 切换按钮 -->
                    <div class="auth-switch">
                        <button id="show-register" class="link-btn">还没有账号？立即注册</button>
                        <button id="show-login" class="link-btn" style="display: none;">已有账号？立即登录</button>
                    </div>

                    <!-- 分割线 -->
                    <div class="divider" style="display: none;">
                        <span>或</span>
                    </div>

                    <!-- 微信登录（已关闭） -->
                    <button id="wechat-login-btn" class="btn secondary" style="display: none;">
                        <span class="icon">🔐</span>
                        微信扫码登录
                    </button>
                    <p class="login-desc" style="display: none;">选择微信登录将打开新页面</p>
                </div>
            </main>
        </div>

        <!-- 已登录状态 -->
        <div id="main-view" class="view" style="display: none;">
            <header class="popup-header logged-in">
                <div class="user-info">
                    <img id="user-avatar" class="avatar" src="" alt="头像">
                    <div class="user-details">
                        <h3 id="user-nickname">用户昵称</h3>
                        <span id="user-vip-badge" class="vip-badge" style="display: none;">VIP</span>
                    </div>
                </div>
                <button id="logout-btn" class="logout-btn" title="退出登录">🚪</button>
            </header>

            <main class="popup-content">
                <div class="feature-section">
                    <h4>快捷功能</h4>
                    <div class="feature-grid">
                        <button class="feature-btn" id="goto-jobs">
                            <span class="feature-icon">💼</span>
                            <span>岗位推荐</span>
                        </button>
                        <button class="feature-btn" id="goto-strategy">
                            <span class="feature-icon">📖</span>
                            <span>求职攻略</span>
                        </button>
                        <button class="feature-btn" id="goto-resume">
                            <span class="feature-icon">📄</span>
                            <span>简历管理</span>
                        </button>
                        <button class="feature-btn" id="goto-profile">
                            <span class="feature-icon">👤</span>
                            <span>个人中心</span>
                        </button>
                    </div>
                </div>

                <div class="floating-control-section">
                    <h4>悬浮助手</h4>
                    <div class="control-item">
                        <div class="control-info">
                            <span class="control-icon">🎯</span>
                            <div class="control-text">
                                <span class="control-label">悬浮按钮</span>
                                <span class="control-desc">在网页右下角显示助手按钮</span>
                            </div>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="floating-toggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="status-section">
                    <p>状态：<span id="status" class="status-ready">就绪</span></p>
                </div>
            </main>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="auth-manager.js"></script>
    <script src="popup.js"></script>
</body>
</html>

<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="64" cy="64" r="56" fill="url(#gradient)" />

  <!-- 插件图标 -->
  <g transform="translate(64, 64)">
    <!-- 拼图形状 -->
    <path d="M -20 -20 L 0 -20 L 0 -10 C 5 -10, 10 -5, 10 0 C 10 5, 5 10, 0 10 L 0 20 L -20 20 L -20 0 L -10 0 C -10 -5, -5 -10, 0 -10 L 0 -20 Z"
          fill="white"
          stroke="none"/>

    <!-- 另一个拼图块 -->
    <path d="M 0 -20 L 20 -20 L 20 0 L 10 0 C 10 5, 15 10, 20 10 C 25 10, 30 5, 30 0 L 30 -10 L 40 -10 L 40 10 L 30 10 C 30 15, 25 20, 20 20 C 15 20, 10 15, 10 10 L 0 10 Z"
          fill="white"
          opacity="0.8"
          stroke="none"/>
  </g>

  <!-- 装饰性圆点 -->
  <circle cx="30" cy="30" r="3" fill="white" opacity="0.6"/>
  <circle cx="98" cy="30" r="3" fill="white" opacity="0.6"/>
  <circle cx="30" cy="98" r="3" fill="white" opacity="0.6"/>
  <circle cx="98" cy="98" r="3" fill="white" opacity="0.6"/>
</svg>
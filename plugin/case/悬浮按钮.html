<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一念职达 - 智能滑钮组件</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ========== 核心设计系统 (继承自您提供的代码) ========== */
        :root {
            --primary: #57c5b6;
            --primary-dark: #3a8e82;
            --accent: #ff9a9e;
            --text-main: #2d3436;
            --text-gray: #636e72;

            --bg-fluid: radial-gradient(circle at 10% 10%, rgba(87, 197, 182, 0.4) 0%, transparent 50%),
                        radial-gradient(circle at 90% 90%, rgba(255, 154, 158, 0.4) 0%, transparent 50%),
                        linear-gradient(135deg, #def7fa 0%, #ffecec 100%);

            --glass-clear-bg: rgba(255, 255, 255, 0.35);
            --glass-clear-blur: blur(12px);
            --glass-clear-border: 1px solid rgba(255, 255, 255, 0.6);
            --glass-clear-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);

            --card-shadow: 0 5px 20px rgba(0, 0, 0, 0.03);
            --r-btn: 30px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body {
            background: var(--bg-fluid);
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
        }

        /* ========== 特制滑钮组件样式 (New Design) ========== */

        /* 1. 滑钮容器 - 玻璃凹槽 */
        .toggle-container {
            position: relative;
            display: flex;
            align-items: center;
            width: 380px; /* 可根据需要调整宽度 */
            height: 64px;
            background: rgba(255, 255, 255, 0.25); /* 比普通玻璃稍透，制造层次 */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            /* 内阴影制造凹槽感 */
            box-shadow: 
                inset 0 2px 6px rgba(0, 0, 0, 0.04), 
                0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 4px;
            user-select: none;
            /* 初始化变量，默认在中间 */
            --current-pos: 1; 
        }

        /* 2. 滑块 (Glider) - 纯白悬浮块 */
        .toggle-glider {
            position: absolute;
            left: 4px;
            top: 4px;
            bottom: 4px;
            width: calc((100% - 8px) / 3); /* 三等分减去间距 */
            background: #ffffff;
            border-radius: 34px;
            box-shadow: 
                0 4px 15px rgba(0, 0, 0, 0.08),
                0 2px 4px rgba(0, 0, 0, 0.02);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); /* 弹性动画 */
            z-index: 1;
            /* 根据位置变量移动 */
            transform: translateX(calc(var(--current-pos) * 100%));
        }

        /* 3. 选项标签 */
        .toggle-option {
            position: relative;
            flex: 1;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            z-index: 2; /* 在滑块之上 */
            cursor: pointer;
            transition: color 0.3s ease;
            color: var(--text-gray);
            font-size: 15px;
            font-weight: 600;
            border-radius: 34px;
        }

        .toggle-option i {
            font-size: 16px;
            transition: transform 0.3s ease;
        }

        /* 选中状态的样式 (通过JS控制父级变量或直接类名) */
        .toggle-option.active {
            color: var(--primary-dark);
        }
        
        .toggle-option.active i {
            transform: scale(1.15) translateY(-1px);
        }

        /* 鼠标悬停微交互 */
        .toggle-option:not(.active):hover {
            color: var(--text-main);
            background: rgba(255,255,255,0.1);
        }

        /* ========== 演示用装饰 (非组件必需) ========== */
        .demo-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .demo-label {
            font-size: 14px;
            color: var(--primary-dark);
            font-weight: 700;
            opacity: 0.8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="demo-wrapper">
        <div class="demo-label">“一键填写”悬浮窗显示方式</div>

        <!-- 组件开始 -->
        <div class="toggle-container" id="modeToggle">
            <!-- 纯装饰用的白色滑块 -->
            <div class="toggle-glider"></div>

            <!-- 选项 1: 隐藏 -->
            <div class="toggle-option" onclick="setToggle(0, this)">
                <i class="fas fa-eye-slash"></i>
                <span>隐藏</span>
            </div>

            <!-- 选项 2: 智能 (默认选中) -->
            <div class="toggle-option active" onclick="setToggle(1, this)">
                <i class="fas fa-wand-magic-sparkles"></i>
                <span>智能</span>
            </div>

            <!-- 选项 3: 常驻 -->
            <div class="toggle-option" onclick="setToggle(2, this)">
                <i class="fas fa-thumbtack"></i>
                <span>常驻</span>
            </div>
        </div>
        <!-- 组件结束 -->
        
    </div>

    <script>
        function setToggle(index, element) {
            const container = document.getElementById('modeToggle');
            const options = container.querySelectorAll('.toggle-option');

            // 1. 更新滑块位置 (修改 CSS 变量)
            // 原理：滑块宽度是1/3，index 0 不需要动，index 1 移动 100% 自身宽度，index 2 移动 200%
            container.style.setProperty('--current-pos', index);

            // 2. 更新文字颜色状态
            options.forEach(opt => opt.classList.remove('active'));
            element.classList.add('active');

            // 3. (可选) 打印当前状态，方便您绑定业务逻辑
            const statusMap = ['hide', 'smart', 'always'];
            console.log("当前模式切换为:", statusMap[index]);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反馈 - 一念职达</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/common.css">
</head>
<body>
    <div class="plugin-container">
        <div class="sidebar">
            <a href="fill.html" class="nav-item">
                <div class="nav-icon-box"><i class="fas fa-magic"></i></div>
                <div class="nav-label">填充</div>
            </a>
            <a href="history.html" class="nav-item">
                <div class="nav-icon-box"><i class="fas fa-history"></i></div>
                <div class="nav-label">记录</div>
            </a>
            <div class="sidebar-spacer"></div>
            <div class="sidebar-bottom">
                <a href="profile.html" class="nav-item">
                    <div class="nav-icon-box"><i class="fas fa-user"></i></div>
                    <div class="nav-label">我的</div>
                </a>
                <a href="settings.html" class="nav-item active">
                    <div class="nav-icon-box"><i class="fas fa-cog"></i></div>
                    <div class="nav-label">设置</div>
                </a>
            </div>
        </div>
        <div class="main-area">
            <div class="liquid-title">我要反馈</div>
            <a href="settings.html" class="liquid-close"><i class="fas fa-times"></i></a>
            <div class="plugin-content">
                <div class="content-card">
                    <div class="card-title"><i class="fas fa-tag"></i> 反馈类型</div>
                    <div class="feedback-type-grid">
                        <button class="feedback-type-btn active" onclick="selectType(this)">问题反馈</button>
                        <button class="feedback-type-btn" onclick="selectType(this)">功能建议</button>
                        <button class="feedback-type-btn" onclick="selectType(this)">其他</button>
                    </div>
                </div>
                <div class="content-card">
                    <div class="card-title"><i class="fas fa-edit"></i> 反馈内容</div>
                    <div class="form-group">
                        <label class="form-label">问题描述 *</label>
                        <textarea class="form-textarea" placeholder="请详细描述您遇到的问题或建议..."></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">联系方式（选填）</label>
                        <input type="text" class="form-input" placeholder="邮箱或手机号">
                    </div>
                </div>
                <button class="btn-primary" onclick="alert('反馈已提交！')"><i class="fas fa-paper-plane"></i> 提交反馈</button>
            </div>
        </div>
    </div>
    <script>
        function selectType(btn) {
            document.querySelectorAll('.feedback-type-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
    <script src="scripts/transitions.js"></script>
</body>
</html>

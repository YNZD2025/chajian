<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能填充 - 一念职达</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/common.css">
    <style>
        .book-wrapper {
            position: relative;
            width: 90%;
            height: 300px;
            perspective: 1000px;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .resume-page-next {
            position: absolute;
            top: 8px;
            right: -16px;
            width: 98%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 18px;
            padding: 14px;
            transform: rotate(3deg) translateZ(-10px);
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.05);
            z-index: 1;
            transition: transform 0.4s ease, filter 0.4s ease, opacity 0.4s ease;
            filter: blur(1px);
            opacity: 0.8;
            overflow: hidden;
        }

        .resume-page-current {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 295px;
            background: white;
            border-radius: 18px;
            padding: 14px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: -5px 10px 30px rgba(0, 0, 0, 0.1);
            z-index: 2;
            transition: transform 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        .book-wrapper:hover .resume-page-current {
            transform: translateX(-15px) rotateY(-5deg) !important;
        }

        .book-wrapper:hover .resume-page-next {
            transform: rotate(1deg) translateZ(0) !important;
            filter: blur(0) !important;
            opacity: 1 !important;
        }

        .switch-tooltip {
            position: absolute;
            right: -5px;
            top: 25px;
            background: var(--accent);
            color: white;
            font-size: 13px;
            padding: 2px 20px;
            border-radius: 5px;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
        }

        .book-wrapper:hover .switch-tooltip {
            opacity: 1;
            right: 0px;
        }

        .skeleton-block {
            height: 30px;
            background: #f0f0f0;
            border-radius: 8px;
            margin-bottom: 6px;
        }

        .skeleton-text {
            height: 6px;
            width: 60%;
            background: #eee;
            margin-bottom: 5px;
            border-radius: 3px;
        }

        .liquid-cta-container {
            position: absolute !important;
            bottom: 27px !important;
            left: 10px !important;
            right: 20px !important;
            display: flex !important;
            flex-direction: row !important;
            flex-wrap: nowrap !important;
            justify-content: center !important; /* 默认居中显示 */
            align-items: center !important;
            pointer-events: none !important;
            z-index: 40 !important;
            gap: 12px !important;
            transition: justify-content 0.3s ease !important;
            width: 100% !important;
        }

        /* 运行状态时，容器改为左对齐 */
        .liquid-cta-container.running {
            justify-content: flex-start !important;
        }

        .liquid-cta-btn {
            pointer-events: auto !important;
            cursor: pointer !important;
            background: var(--glass-clear-bg) !important;
            backdrop-filter: var(--glass-clear-blur) !important;
            -webkit-backdrop-filter: var(--glass-clear-blur) !important;
            box-shadow: 0 10px 10px rgba(255, 154, 158, 0.25) !important;
            border: 1px solid var(--accent) !important;
            padding: 10px 14px !important;
            border-radius: 25px !important;
            color: var(--accent) !important;
            font-size: 13px !important;
            font-weight: 700 !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 6px !important;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease !important;
            flex-shrink: 0 !important;
            flex-grow: 0 !important;
            width: auto !important;
            min-width: 120px !important;
            max-width: 90% !important;
        }

        .liquid-cta-btn:hover {
            transform: translateY(-2px) !important;
            background: rgba(255, 255, 255, 0.35) !important;
            box-shadow: 0 15px 35px rgba(255, 154, 158, 0.35) !important;
        }

        /* 按钮图标模式：只显示图标，隐藏文字 */
        .liquid-cta-btn.icon-mode {
            min-width: 45px !important;
            max-width: 45px !important;
            width: 45px !important;
            height: 45px !important;
            padding: 0 !important;
            justify-content: center !important;
            border-radius: 50% !important;
            transition: all 0.3s ease !important;
        }

        .liquid-cta-btn.icon-mode .btn-text {
            display: none !important;
        }

        .liquid-cta-btn.icon-mode i {
            font-size: 18px !important;
            margin: 0 !important;
        }

        /* 状态展示框样式 */
        .status-display {
            pointer-events: auto !important;
            background: var(--glass-clear-bg) !important;
            backdrop-filter: var(--glass-clear-blur) !important;
            -webkit-backdrop-filter: var(--glass-clear-blur) !important;
            box-shadow: 0 10px 10px rgba(255, 154, 158, 0.25) !important;
            border: 1px solid var(--accent) !important;
            padding: 8px 12px !important;
            border-radius: 20px !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 8px !important;
            flex-shrink: 1 !important;
            flex-grow: 0 !important;
            /* width: auto !important; */
            min-width: 260px !important;
            max-width: 260px !important;
            opacity: 1 !important;
            transition: opacity 0.3s ease, transform 0.3s ease !important;
            height: 45px !important;
        }

        /* 默认状态：隐藏状态框 */
        .status-display.hidden {
            display: none !important;
        }

        .status-icon {
            font-size: 14px !important;
            color: var(--primary) !important;
            flex-shrink: 0 !important;
        }

        .status-text {
            font-size: 12px !important;
            font-weight: 600 !important;
            color: var(--accent) !important;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
        }

        /* 转圈图标（processing 状态）颜色 */
        .status-icon.fa-spinner {
            color: #FF9A9E !important;
        }

        .status-display.status-success .status-icon {
            color: #FF9A9E !important;
        }

        .status-display.status-error .status-icon {
            color: #dc3545 !important;
        }


        .task-card {
            background: white;
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        .task-card h4 {
            margin-bottom: 8px;
            font-size: 12px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .task-card h4 i {
            color: var(--primary);
            font-size: 10px;
        }

        .task-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #e8e8e8;
            border-radius: 10px;
            font-size: 11px;
            color: var(--text-main);
            background: #fafafa;
            min-height: 60px;
            resize: none;
            line-height: 1.5;
        }

        .task-input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
        }

        .task-input::placeholder {
            color: #bbb;
        }

        .resume-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #f5f5f5;
        }

        .resume-avatar {
            width: 32px;
            height: 32px;
            border-radius: 10px;
        }

        .resume-meta {
            flex: 1;
        }

        .resume-name {
            font-size: 13px;
            font-weight: 456;
            color: var(--text-main);
        }

        .resume-type {
            font-size: 10px;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 2px 8px;
            border-radius: 8px;
            margin-top: 5px;
            margin-left: -3px;
            display: inline-block;
        }

        .info-grid-compact {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            font-size: 10px;
            flex: 1;
            overflow-y: auto;
        }

        .info-cell {
            background: #f9f9f9;
            padding: 5px 6px;
            border-radius: 6px;
        }

        .info-cell-label {
            font-size: 8px;
            color: #999;
            margin-bottom: 2px;
        }

        .info-cell-value {
            color: var(--text-main);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .resume-switch-btn {
            background: var(--accent) !important;
            color: white !important;
            border: none !important;
            font-size: 9px !important;
            padding: 2px 5px !important;
            border-radius: 5px !important;
            white-space: nowrap !important;
            cursor: pointer !important;
            transition: 0.3s !important;
            pointer-events: auto !important;
            font-weight: normal !important;
            display: inline-block !important;
        }

        .resume-switch-btn:hover {
            opacity: 0.8 !important;
        }

        /* ========== 额度显示样式 ========== */
        .header-right-container {
            position: absolute;
            top: 20px;
            right: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 30;
        }

        .quota-display {
            background: var(--glass-clear-bg);
            backdrop-filter: var(--glass-clear-blur);
            -webkit-backdrop-filter: var(--glass-clear-blur);
            border: var(--glass-clear-border);
            box-shadow: var(--glass-clear-shadow);
            padding: 10px 20px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 0px;
            
        }

        .quota-label {
            font-size: 16px;
            color: var(--text-main);
            font-weight: 456;
        }

        .quota-value {
            font-size: 15px;
            color: var(--primary);
            font-weight: 700;
        }

        .quota-value.low {
            color: var(--accent);
        }

        .quota-value.empty {
            color: #dc3545;
        }

        /* 覆盖关闭按钮的position，因为它现在在容器中 */
        .header-right-container .liquid-close {
            position: relative;
            top: auto;
            right: auto;
        }

        .resume-switch-controls {
            position: absolute !important;
            top: 25px !important;
            right: -25px !important;
            display: flex !important;
            gap: 5px !important;
            z-index: 10 !important;
            opacity: 0 !important;
            transition: 0.3s !important;
            pointer-events: none !important;
        }

        .book-wrapper:hover .resume-switch-controls {
            opacity: 1 !important;
            right: -20px !important;
            pointer-events: auto !important;
        }

        .task-title{
            font-size: 13px;
            font-weight: 456;
            color: var(--text-main);
        }

        /* ========== 图标备用样式 ========== */
        .fas::before,
        .far::before,
        .fab::before {
            font-family: "Font Awesome 6 Free" !important;
            font-weight: 900 !important;
            display: inline-block !important;
            font-style: normal !important;
            font-variant: normal !important;
            text-rendering: auto !important;
            line-height: 1 !important;
        }

        .fa-magic::before {
            content: "\f0d0";
        }

        .fa-bolt::before {
            content: "\f0e7";
        }

        .fa-history::before {
            content: "\f1da";
        }

        .fa-user::before {
            content: "\f007";
        }

        .fa-cog::before {
            content: "\f013";
        }

        .fa-times::before {
            content: "\f00d";
        }

        .fa-info-circle::before {
            content: "\f05a";
        }

        .fa-edit::before {
            content: "\f044";
        }

        .fa-spinner::before {
            content: "\f110";
        }

        .fa-spin {
            animation: fa-spin 2s infinite linear;
        }

        @keyframes fa-spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* 如果Font Awesome没加载，使用文字备用 */
        .fas:not([class*="fa-"])::before,
        .far:not([class*="fa-"])::before {
            content: "●";
        }

        /* ========== 呼吸动画效果 ========== */
        /* 状态框呼吸效果 - 边框和阴影脉动 */
        @keyframes status-breathe {
            0%, 100% {
                border-color: var(--accent);
                box-shadow: 0 10px 10px rgba(255, 154, 158, 0.25),
                            0 0 0 0 rgba(255, 154, 158, 0.4);
            }
            50% {
                border-color: var(--primary);
                box-shadow: 0 10px 20px rgba(255, 154, 158, 0.35),
                            0 0 15px 5px rgba(87, 197, 182, 0.3);
            }
        }

        /* 图标旋转脉动效果 */
        @keyframes icon-pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.15);
                opacity: 0.8;
            }
        }

        /* 运行状态的呼吸效果类 */
        .status-display.breathing {
            animation: status-breathe 2s ease-in-out infinite !important;
        }

        .status-icon.pulsing {
            animation: icon-pulse 1.5s ease-in-out infinite !important;
        }
    </style>
</head>

<body>

                </div>

                <div class="task-card">

        </div>
    </div>
    <script src="scripts/transitions.js"></script>
    <script src="scripts/statusPopup.js"></script>
</body>

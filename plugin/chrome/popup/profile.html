<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>个人中心 - 一念职达</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles/common.css" rel="stylesheet">
    <style>
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }

        .profile-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .profile-name {
            margin-top: 8px;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .profile-status {
            font-size: 10px;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 2px 8px;
            border-radius: 8px;
            margin-top: 5px;
        }

        .book-wrapper {
            position: relative;
            width: 96%;
            height: 280px;
            perspective: 1000px;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .resume-page-next {
            position: absolute;
            top: 8px;
            right: -16px;
            width: 98%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 18px;
            padding: 14px;
            transform: rotate(3deg) translateZ(-10px);
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.05);
            z-index: 1;
            transition: transform 0.4s ease, filter 0.4s ease, opacity 0.4s ease;
            filter: blur(1px);
            opacity: 0.8;
            overflow: hidden;
        }

        .resume-page-current {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 18px;
            padding: 14px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: -5px 10px 30px rgba(0, 0, 0, 0.1);
            z-index: 2;
            transition: transform 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        .book-wrapper:hover .resume-page-current {
            transform: translateX(-20px) rotateY(-5deg) !important;
        }

        .book-wrapper:hover .resume-page-next {
            transform: rotate(1deg) translateZ(0) !important;
            filter: blur(0) !important;
            opacity: 1 !important;
        }

        .switch-tooltip {
            position: absolute;
            right: -5px;
            top: 25px;
            background: var(--accent);
            color: white;
            font-size: 13px;
            padding: 2px 20px;
            border-radius: 5px;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
        }

        .book-wrapper:hover .switch-tooltip {
            opacity: 1;
            right: 0px;
        }

        .skeleton-block {
            height: 30px;
            background: #f0f0f0;
            border-radius: 8px;
            margin-bottom: 6px;
        }

        .skeleton-text {
            height: 6px;
            width: 60%;
            background: #eee;
            margin-bottom: 5px;
            border-radius: 3px;
        }

        .resume-section {
            margin-bottom: 12px;
        }

        .resume-section h4 {
            color: var(--primary);
            font-size: 12px;
            margin-bottom: 6px;
        }

        .resume-section .title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .resume-section .subtitle {
            font-size: 10px;
            color: #999;
        }

        .resume-divider {
            height: 1px;
            background: #f5f5f5;
            margin: 10px 0;
        }

        .resume-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #f5f5f5;
        }

        .resume-avatar {
            width: 32px;
            height: 32px;
            border-radius: 10px;
        }

        .resume-meta {
            flex: 1;
        }

        .resume-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
        }

        .resume-type {
            font-size: 9px;
            color: var(--primary);
        }


        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .skill-tag {
            font-size: 9px;
            background: #e0f7fa;
            color: var(--dark-green);
            padding: 2px 6px;
            border-radius: 5px;
        }

        .edit-resume-btn {
            margin-top: auto;
            border: 1px solid var(--accent);
            color: var(--accent);
            background: white;
            padding: 8px 0;
            border-radius: 18px;
            font-size: 11px;
            width: 100%;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .edit-resume-btn:hover {
            background: var(--accent);
            color: white;
        }

        .info-grid-compact {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            font-size: 10px;
            flex: 1;
            overflow-y: auto;
        }

        .info-cell {
            background: #f9f9f9;
            padding: 5px 6px;
            border-radius: 6px;
        }

        .info-cell-label {
            font-size: 8px;
            color: #999;
            margin-bottom: 2px;
        }

        .info-cell-value {
            color: var(--text-main);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 简历内容区域 - 使其占据剩余空间并可滚动 */
        .info-grid-compact {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 12px;
            padding-right: 5px;
        }

        /* 自定义滚动条样式 */
        .info-grid-compact::-webkit-scrollbar {
            width: 4px;
        }

        .info-grid-compact::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 2px;
        }

        .info-grid-compact::-webkit-scrollbar-thumb:hover {
            background: #ccc;
        }

        .edit-resume-btn {
            margin-top: auto;
            border: 1px solid var(--accent);
            color: var(--accent);
            background: white;
            padding: 8px 0;
            border-radius: 18px;
            font-size: 11px;
            width: 100%;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .edit-resume-btn:hover {
            background: var(--accent);
            color: white;
        }

        /* 让内容居中 */
        .profile-content-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
        }

        /* ========== 图标备用样式 ========== */
        .fas::before,
        .far::before,
        .fab::before {
            font-family: "Font Awesome 6 Free" !important;
            font-weight: 900 !important;
            display: inline-block !important;
            font-style: normal !important;
            font-variant: normal !important;
            text-rendering: auto !important;
            line-height: 1 !important;
        }

        .fa-magic::before {
            content: "\f0d0";
        }

        .fa-bolt::before {
            content: "\f0e7";
        }

        .fa-history::before {
            content: "\f1da";
        }

        .fa-user::before {
            content: "\f007";
        }

        .fa-cog::before {
            content: "\f013";
        }

        .fa-times::before {
            content: "\f00d";
        }

        .fa-info-circle::before {
            content: "\f05a";
        }

        .fa-edit::before {
            content: "\f044";
        }

        .fa-spinner::before {
            content: "\f110";
        }

        .fa-spin {
            animation: fa-spin 2s infinite linear;
        }

        @keyframes fa-spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* 如果Font Awesome没加载，使用文字备用 */
        .fas:not([class*="fa-"])::before,
        .far:not([class*="fa-"])::before {
            content: "●";
        }
    </style>
</head>
<body>
<div class="plugin-container">
    <div class="sidebar">
        <a class="nav-item" href="fill.html">
            <div class="nav-icon-box"><i class="fas fa-magic"></i></div>
            <div class="nav-label">填充</div>
        </a>
        <a class="nav-item" href="history.html">
            <div class="nav-icon-box"><i class="fas fa-history"></i></div>
            <div class="nav-label">记录</div>
        </a>
        <div class="sidebar-spacer"></div>
        <div class="sidebar-bottom">
            <a class="nav-item active" href="profile.html">
                <div class="nav-icon-box"><i class="fas fa-user"></i></div>
                <div class="nav-label">我的</div>
            </a>
            <a class="nav-item" href="settings.html">
                <div class="nav-icon-box"><i class="fas fa-cog"></i></div>
                <div class="nav-label">设置</div>
            </a>
        </div>
    </div>
    <div class="main-area">
        <div class="liquid-title">个人中心</div>
        <a class="liquid-close" href="javascript:void(0)"><i class="fas fa-times"></i></a>
        <div class="plugin-content">
            <div class="profile-content-wrapper">
                <div class="profile-header">
                    <img class="profile-avatar" id="user-avatar" src="logo-small.png">
                    <div class="profile-name" id="user-nickname">李艺伟</div>
                    <div class="profile-status">求职中</div>
                </div>

                <div class="book-wrapper">
                    <div class="switch-tooltip">切换下一份简历</div>
                    <div class="resume-page-next">
                        <div style="text-align:right; font-size:8px; color:var(--primary); font-weight:bold; margin-bottom:6px;">
                            简历 B
                        </div>
                        <div style="font-size:10px; font-weight:bold; color:#ccc;">加载中...</div>
                        <div class="skeleton-text"></div>
                        <div class="skeleton-block"></div>
                    </div>

                    <div class="resume-page-current">
                        <div class="resume-header">
                            <div class="resume-meta">
                                <div class="resume-name" id="resume-nickname">李艺伟</div>
                                <div class="resume-type">中文简历 (默认)</div>
                            </div>
                        </div>

                        <div class="info-grid-compact">
                            <div class="info-cell">
                                <div class="info-cell-label">学校</div>
                                <div class="info-cell-value">清华大学</div>
                            </div>
                            <div class="info-cell">
                                <div class="info-cell-label">学历</div>
                                <div class="info-cell-value">硕士</div>
                            </div>
                            <div class="info-cell">
                                <div class="info-cell-label">专业</div>
                                <div class="info-cell-value">计算机科学与技术</div>
                            </div>
                            <div class="info-cell">
                                <div class="info-cell-label">毕业年份</div>
                                <div class="info-cell-value">2026</div>
                            </div>
                            <div class="info-cell">
                                <div class="info-cell-label">手机</div>
                                <div class="info-cell-value">138****9876</div>
                            </div>
                            <div class="info-cell">
                                <div class="info-cell-label">邮箱</div>
                                <div class="info-cell-value">li***@thu.edu</div>
                            </div>
                            <div class="info-cell">
                                <div class="info-cell-label">意向岗位</div>
                                <div class="info-cell-value">算法工程师</div>
                            </div>
                            <div class="info-cell">
                                <div class="info-cell-label">期望城市</div>
                                <div class="info-cell-value">北京/上海</div>
                            </div>
                            <div class="info-cell" style="grid-column: span 2;">
                                <div class="info-cell-label">核心技能</div>
                                <div class="info-cell-value">Python, C++, PyTorch, TensorFlow</div>
                            </div>
                        </div>

                        <button class="edit-resume-btn" onclick="location.href='edit-resume.html'">编辑简历</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="scripts/transitions.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 - 一念职达</title>
    <link rel="stylesheet" href="styles/simple-icons.css">
    <link rel="stylesheet" href="styles/common.css">
    <style>
        /* settingsMini 页面专用样式 - 适配固定尺寸不滚动 */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .plugin-container {
            width: 280px;
            height: 600px;
            overflow: hidden;
        }

        .main-area {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .liquid-title {
            margin-bottom: 15px;
            font-size: 14px;
            padding: 10px 15px;
        }

        .liquid-close {
            right: 15px;
            top: 20px;
            width: 28px;
            height: 28px;
            font-size: 12px;
        }

        .plugin-content {
            flex: 1;
            overflow: hidden;
            padding: 70px 15px 20px 15px;
            display: flex;
            flex-direction: column;
        }

        .settings-content-wrapper {
            flex: 0 1 auto;
            overflow-y: auto;
            max-height: calc(100% - 120px);
        }

        .settings-content-wrapper::-webkit-scrollbar {
            width: 4px;
        }

        .settings-content-wrapper::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 2px;
        }

        .settings-content-wrapper::-webkit-scrollbar-thumb:hover {
            background: #ccc;
        }

        .content-card {
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 12px;
            margin-bottom: 8px;
        }

        .settings-group {
            gap: 0;
        }

        .settings-item {
            padding: 10px 12px;
            min-height: auto;
        }

        .settings-item-icon {
            width: 30px;
            height: 30px;
            font-size: 13px;
        }

        .settings-item-label {
            font-size: 12px;
        }

        .arrow-icon {
            font-size: 11px;
        }

        .settings-bottom {
            flex-shrink: 0;
            margin-top: auto;
        }

        .btn-danger {
            flex-shrink: 0;
            padding: 10px 0;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .plugin-footer {
            padding-top: 8px;
            flex-shrink: 0;
        }

        .plugin-footer p {
            font-size: 10px;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="plugin-container">

        <!-- 主内容区 -->
        <div class="main-area">
            <!-- 悬浮标题 -->
            <div class="liquid-title">设置</div>
            <!-- 悬浮关闭按钮 -->
            <a href="javascript:history.back()" class="liquid-close"><i class="fas fa-times"></i></a>

            <!-- 滚动内容 -->
            <div class="plugin-content">
                <!-- 上部内容区 -->
                <div class="settings-content-wrapper">
                    <!-- 账号设置 -->
                    <div class="content-card">
                        <div class="card-title">
                            <i class="fas fa-user-cog" ></i> 账号设置
                        </div>
                        <div class="settings-group">
                            <a href="edit-resume.html" class="settings-item">
                                <div class="settings-item-left">
                                    <div class="settings-item-icon primary">
                                        <i class="fas fa-id-card"></i>
                                    </div>
                                    <div class="settings-item-label">修改简历信息</div>
                                </div>
                                <i class="fas fa-chevron-right arrow-icon"></i>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- 底部固定区 -->
                <div class="settings-bottom">
                    <!-- 退出登录 -->
                    <button class="btn-danger" onclick="alert('已退出登录')">
                        <i class="fas fa-sign-out-alt"></i> 退出登录
                    </button>

                    <!-- 页脚 -->
                    <div class="plugin-footer">
                        <p>一念职达 v1.0.0</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts/transitions.js"></script>
    <script src="scripts/settingsMini.js"></script>
</body>
</html>

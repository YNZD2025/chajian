<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投递记录 - 一念职达</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/common.css">
    <style>
        .job-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: white; border-radius: 14px; margin-bottom: 10px; }
        .status-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; margin-right: 12px; box-shadow: 0 0 8px var(--accent); }
        .status-dot.inactive { background: #ccc; box-shadow: none; }
        .view-btn { background: #f7f9fa; padding: 5px 12px; border-radius: 12px; font-size: 11px; color: var(--text-gray); border: none; font-weight: 600; cursor: pointer; }
        .view-btn:hover { background: #edf1f3; color: var(--primary); }

        /* 为投递记录列表启用滚动功能 */
        .plugin-content {
            overflow-y: auto !important;
            overflow-x: hidden !important;
        }

        /* 自定义滚动条样式 */
        .plugin-content::-webkit-scrollbar {
            width: 6px;
        }
        .plugin-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .plugin-content::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 3px;
        }
        .plugin-content::-webkit-scrollbar-thumb:hover {
            background: #ccc;
        }

        /* ========== 图标备用样式 ========== */
        .fas::before,
        .far::before,
        .fab::before {
            font-family: "Font Awesome 6 Free" !important;
            font-weight: 900 !important;
            display: inline-block !important;
            font-style: normal !important;
            font-variant: normal !important;
            text-rendering: auto !important;
            line-height: 1 !important;
        }

        .fa-magic::before {
            content: "\f0d0";
        }

        .fa-bolt::before {
            content: "\f0e7";
        }

        .fa-history::before {
            content: "\f1da";
        }

        .fa-user::before {
            content: "\f007";
        }

        .fa-cog::before {
            content: "\f013";
        }

        .fa-times::before {
            content: "\f00d";
        }

        .fa-info-circle::before {
            content: "\f05a";
        }

        .fa-edit::before {
            content: "\f044";
        }

        .fa-spinner::before {
            content: "\f110";
        }

        .fa-spin {
            animation: fa-spin 2s infinite linear;
        }

        @keyframes fa-spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* 如果Font Awesome没加载，使用文字备用 */
        .fas:not([class*="fa-"])::before,
        .far:not([class*="fa-"])::before {
            content: "●";
        }
    </style>
</head>
<body>
    <div class="plugin-container">
        <div class="sidebar">
            <a href="fill.html" class="nav-item">
                <div class="nav-icon-box"><i class="fas fa-magic"></i></div>
                <div class="nav-label">填充</div>
            </a>
            <a href="history.html" class="nav-item active">
                <div class="nav-icon-box"><i class="fas fa-history"></i></div>
                <div class="nav-label">记录</div>
            </a>
            <div class="sidebar-spacer"></div>
            <div class="sidebar-bottom">
                <a href="profile.html" class="nav-item">
                    <div class="nav-icon-box"><i class="fas fa-user"></i></div>
                    <div class="nav-label">我的</div>
                </a>
                <a href="settings.html" class="nav-item">
                    <div class="nav-icon-box"><i class="fas fa-cog"></i></div>
                    <div class="nav-label">设置</div>
                </a>
            </div>
        </div>
        <div class="main-area">
            <div class="liquid-title">投递记录</div>
            <a href="javascript:void(0)" class="liquid-close"><i class="fas fa-times"></i></a>
            <div class="plugin-content">
                <!-- 投递记录将通过 JavaScript 动态加载 -->
                <div style="text-align: center; padding: 60px 20px; color: #999;">
                    <i class="fas fa-spinner fa-spin" style="font-size: 48px; margin-bottom: 16px; color: #ddd;"></i>
                    <div style="font-size: 14px;">加载中...</div>
                </div>
            </div>
        </div>
    </div>
    <script src="scripts/transitions.js"></script>
</body>
</html>

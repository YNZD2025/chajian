<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 一念职达</title>
    <link rel="stylesheet" href="styles/font-awesome.min.css">
    <link rel="stylesheet" href="styles/common.css">
    <style>
        /* profileMini 页面专用样式 - 适配固定尺寸不滚动 */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .plugin-container {
            width: 305px;
            height: 575px;
            overflow: hidden;
        }

        .main-area {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .liquid-close {
            position: absolute;
            right: 15px;
            top: 15px;
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            color: var(--primary);
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: 0.3s;
        }

        .liquid-close:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .plugin-content {
            flex: 1;
            overflow: hidden;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        /* 个人信息区 */
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 12px;
            padding-top: 10px;
        }

        .profile-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .profile-name {
            margin-top: 6px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }

        .profile-status {
            font-size: 9px;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 2px 6px;
            border-radius: 6px;
            margin-top: 4px;
        }

        /* 简历卡片区 */
        .book-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
            perspective: 1000px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .resume-page-next {
            position: absolute;
            top: 6px;
            right: -8px;
            width: 96%;
            height: 100%;
            background: rgba(255,255,255,0.8);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 15px;
            padding: 12px;
            transform: rotate(3deg) translateZ(-10px);
            box-shadow: 2px 2px 8px rgba(0,0,0,0.05);
            z-index: 1;
            transition: transform 0.4s ease;
            filter: blur(1px);
            opacity: 0.8;
            overflow: hidden;
        }

        .resume-page-current {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 15px;
            padding: 12px;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: -3px 6px 20px rgba(0,0,0,0.1);
            z-index: 2;
            transition: transform 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        .book-wrapper:hover .resume-page-current {
            transform: translateX(-15px) rotateY(-5deg);
        }

        .book-wrapper:hover .resume-page-next {
            transform: rotate(1deg) translateZ(0);
            filter: blur(0);
            opacity: 1;
        }

        .switch-tooltip {
            position: absolute;
            right: 10px;
            top: 20px;
            background: var(--accent);
            color: white;
            font-size: 8px;
            padding: 2px 4px;
            border-radius: 4px;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
        }

        .book-wrapper:hover .switch-tooltip {
            opacity: 1;
            right: 8px;
        }

        .skeleton-block {
            height: 25px;
            background: #f0f0f0;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .skeleton-text {
            height: 6px;
            width: 60%;
            background: #eee;
            margin-bottom: 5px;
            border-radius: 3px;
        }

        .resume-header {
            margin-bottom: 8px;
        }

        .resume-meta {
            display: flex;
            flex-direction: column;
        }

        .resume-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
        }

        .resume-type {
            font-size: 9px;
            color: var(--text-light);
            margin-top: 2px;
        }

        /* 简历内容区域 - 使其占据剩余空间并可滚动 */
        .info-grid-compact {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            padding-right: 3px;
        }

        .info-grid-compact::-webkit-scrollbar {
            width: 3px;
        }

        .info-grid-compact::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 2px;
        }

        .info-grid-compact::-webkit-scrollbar-thumb:hover {
            background: #ccc;
        }

        .info-cell {
            background: rgba(0,0,0,0.02);
            padding: 6px;
            border-radius: 6px;
        }

        .info-cell-label {
            font-size: 9px;
            color: var(--text-light);
            margin-bottom: 3px;
        }

        .info-cell-value {
            font-size: 10px;
            color: var(--text-main);
            font-weight: 600;
            word-break: break-all;
        }

        /* 顶部按钮区 */
        .top-buttons {
            flex-shrink: 0;
            display: flex;
            gap: 12px;
            padding-bottom: 10px;
            justify-content: flex-start;
        }

        .btn-settings,
        .btn-logout {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-settings {
            color: var(--primary);
        }

        .btn-settings:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .btn-logout {
            color: var(--primary);
        }

        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px rgba(220,53,69,0.3);
        }

        /* 未登录状态 */
        .not-logged-in {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .login-prompt {
            background: white;
            border-radius: 15px;
            padding: 30px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .login-prompt-icon {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .login-prompt-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 20px;
        }

        .btn-login {
            padding: 12px 30px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-login:hover {
            background: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-login i {
            font-size: 16px;
        }

        /* 已登录状态 */
        .logged-in {
            display: none;
            flex: 1;
            flex-direction: column;
        }

        /* 页脚 */
        .plugin-footer {
            flex-shrink: 0;
            text-align: center;
            padding-top: 8px;
        }

        .plugin-footer p {
            font-size: 9px;
            color: var(--text-light);
            margin: 0;
        }

        /* 常驻设置框 - 滑钮组件 */
        .toggle-container {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            height: 48px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow:
                inset 0 2px 6px rgba(0, 0, 0, 0.04),
                0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 4px;
            user-select: none;
            margin-top: 12px;
            --current-pos: 0;
        }

        .toggle-glider {
            position: absolute;
            left: 4px;
            top: 4px;
            bottom: 4px;
            width: calc((100% - 8px) / 3);
            background: #ffffff;
            border-radius: 26px;
            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.08),
                0 2px 4px rgba(0, 0, 0, 0.02);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1;
            transform: translateX(calc(var(--current-pos) * 100%));
        }

        .toggle-option {
            position: relative;
            flex: 1;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            z-index: 2;
            cursor: pointer;
            transition: color 0.3s ease;
            color: var(--text-light);
            font-size: 11px;
            font-weight: 600;
            border-radius: 26px;
        }

        .toggle-option i {
            font-size: 12px;
            transition: transform 0.3s ease;
        }

        .toggle-option.active {
            color: var(--primary-dark);
        }

        .toggle-option.active i {
            transform: scale(1.15) translateY(-1px);
        }

        .toggle-option:not(.active):hover {
            color: var(--text-main);
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div class="plugin-container">
        <div class="main-area">
            <a href="javascript:void(0)" class="liquid-close"><i class="fas fa-times"></i></a>

            <div class="plugin-content">
                <!-- 顶部按钮区 -->
                <div class="top-buttons">
                    <button class="btn-settings" title="设置">
                        <i class="fas fa-cog"></i>
                    </button>
                    <button class="btn-logout" title="退出登录">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>

                <!-- 未登录状态 -->
                <div id="not-logged-in" class="not-logged-in">
                    <div class="login-prompt">
                        <div class="login-prompt-icon">
                            <i class="fas fa-user-circle"></i>
                        </div>
                        <div class="login-prompt-text">请先登录</div>
                        <button class="btn-login" id="btn-go-login">
                            <i class="fas fa-sign-in-alt"></i>
                            <span>立即登录</span>
                        </button>
                    </div>
                </div>

                <!-- 已登录状态 -->
                <div id="logged-in" class="logged-in">
                    <!-- 个人信息区 -->
                    <div class="profile-header">
                        <img src="logo-small.png" class="profile-avatar" id="user-avatar">
                        <div class="profile-name" id="user-nickname">加载中...</div>
                        <div class="profile-status">求职中</div>
                    </div>

                    <!-- 简历卡片区 -->
                    <div class="book-wrapper">
                        <!-- <div class="switch-tooltip">切换下一份简历</div> -->
                        <div class="resume-page-next">
                            <div style="text-align:right; font-size:7px; color:var(--primary); font-weight:bold; margin-bottom:4px;">简历 B</div>
                            <div style="font-size:9px; font-weight:bold; color:#ccc;">加载中...</div>
                            <div class="skeleton-text"></div>
                            <div class="skeleton-block"></div>
                        </div>

                        <div class="resume-page-current">
                            <div class="resume-header">
                                <div class="resume-meta">
                                    <div class="resume-name" id="resume-nickname">加载中...</div>
                                    <div class="resume-type">简历名称</div>
                                </div>
                            </div>

                            <div class="info-grid-compact">
                                <div class="info-cell">
                                    <div class="info-cell-label">学校</div>
                                    <div class="info-cell-value">-</div>
                                </div>
                                <div class="info-cell">
                                    <div class="info-cell-label">学历</div>
                                    <div class="info-cell-value">-</div>
                                </div>
                                <div class="info-cell">
                                    <div class="info-cell-label">专业</div>
                                    <div class="info-cell-value">-</div>
                                </div>
                                <div class="info-cell">
                                    <div class="info-cell-label">毕业年份</div>
                                    <div class="info-cell-value">-</div>
                                </div>
                                <div class="info-cell">
                                    <div class="info-cell-label">手机</div>
                                    <div class="info-cell-value">-</div>
                                </div>
                                <div class="info-cell">
                                    <div class="info-cell-label">邮箱</div>
                                    <div class="info-cell-value">-</div>
                                </div>
                                <div class="info-cell">
                                    <div class="info-cell-label">意向岗位</div>
                                    <div class="info-cell-value">-</div>
                                </div>
                                <div class="info-cell">
                                    <div class="info-cell-label">期望城市</div>
                                    <div class="info-cell-value">-</div>
                                </div>
                                <div class="info-cell" style="grid-column: span 2;">
                                    <div class="info-cell-label">核心技能</div>
                                    <div class="info-cell-value">-</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 常驻设置框 - 滑钮组件 -->
                    <div class="toggle-container" id="modeToggle">
                        <!-- 滑块 -->
                        <div class="toggle-glider"></div>

                        <!-- 选项 1: 常驻 (默认选中) -->
                        <div class="toggle-option active" data-mode="always" data-index="0">
                            <i class="fas fa-thumbtack"></i>
                            <span>常驻</span>
                        </div>

                        <!-- 选项 2: 智能 -->
                        <div class="toggle-option" data-mode="smart" data-index="1">
                            <i class="fas fa-wand-magic-sparkles"></i>
                            <span>智能</span>
                        </div>

                        <!-- 选项 3: 隐藏 -->
                        <div class="toggle-option" data-mode="hidden" data-index="2">
                            <i class="fas fa-eye-slash"></i>
                            <span>隐藏</span>
                        </div>
                    </div>
                </div>

                <!-- 页脚 -->
                <div class="plugin-footer">
                    <p>一念职达 v1.0.0</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>

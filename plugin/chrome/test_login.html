<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录测试页面 - 一念职达</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
            font-family: monospace;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .info {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .info h3 {
            margin-bottom: 10px;
            color: #667eea;
        }

        .info p {
            color: #555;
            line-height: 1.6;
            font-size: 14px;
        }

        .info code {
            background: #e0e7ff;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
            color: #667eea;
        }

        .log {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
        }

        .log-item {
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 13px;
            font-family: monospace;
        }

        .log-item.success {
            background: #d4edda;
            color: #155724;
        }

        .log-item.error {
            background: #f8d7da;
            color: #721c24;
        }

        .log-item.info {
            background: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 登录测试页面</h1>

        <div class="info">
            <h3>📋 使用说明</h3>
            <p>1. 确保已安装并启用"一念职达"Chrome扩展</p>
            <p>2. 填写测试数据（已预填充默认值）</p>
            <p>3. 点击"发送登录消息到扩展"按钮</p>
            <p>4. 查看下方日志输出</p>
            <p>5. 扩展ID会自动从manifest获取</p>
        </div>

        <div class="form-group">
            <label for="accessToken">Access Token</label>
            <input type="text" id="accessToken" value="test_access_token_123456">
        </div>

        <div class="form-group">
            <label for="refreshToken">Refresh Token</label>
            <input type="text" id="refreshToken" value="test_refresh_token_123456">
        </div>

        <div class="form-group">
            <label for="userInfo">用户信息 (JSON)</label>
            <textarea id="userInfo">{"userId": "123", "username": "测试用户", "email": "test@example.com"}</textarea>
        </div>

        <button onclick="sendLoginMessage()">发送登录消息到扩展</button>
        <button onclick="sendPingMessage()" style="margin-top: 10px; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);">测试扩展连接 (Ping)</button>
        <button onclick="sendLogoutMessage()" style="margin-top: 10px; background: linear-gradient(135deg, #ee0979 0%, #ff6a00 100%);">发送登出消息</button>

        <div class="log" id="logContainer">
            <div class="log-item info">等待操作...</div>
        </div>
    </div>

    <script>
        const logContainer = document.getElementById('logContainer');

        function log(message, type = 'info') {
            const logItem = document.createElement('div');
            logItem.className = `log-item ${type}`;
            logItem.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.insertBefore(logItem, logContainer.firstChild);
        }

        /**
         * 发送Ping消息测试扩展连接
         */
        async function sendPingMessage() {
            try {
                log('正在测试扩展连接...', 'info');

                // 方法1: 使用扩展ID发送消息
                const extensionId = 'YOUR_EXTENSION_ID'; // 需要替换为实际的扩展ID

                chrome.runtime.sendMessage(
                    extensionId,
                    { type: 'ping' },
                    function(response) {
                        if (chrome.runtime.lastError) {
                            log(`❌ 连接失败: ${chrome.runtime.lastError.message}`, 'error');
                            log('💡 提示: 请检查扩展是否已安装并启用', 'info');
                            log('💡 提示: 需要将此页面的域名添加到manifest.json的externally_connectable中', 'info');
                        } else {
                            log(`✅ 扩展连接成功! 版本: ${response.version}`, 'success');
                            log(`📦 响应数据: ${JSON.stringify(response)}`, 'info');
                        }
                    }
                );
            } catch (error) {
                log(`❌ 发送失败: ${error.message}`, 'error');
            }
        }

        /**
         * 发送登录消息到Chrome扩展
         */
        async function sendLoginMessage() {
            try {
                const accessToken = document.getElementById('accessToken').value;
                const refreshToken = document.getElementById('refreshToken').value;
                const userInfoStr = document.getElementById('userInfo').value;

                if (!accessToken || !refreshToken) {
                    log('❌ 请填写完整的Token信息', 'error');
                    return;
                }

                let userInfo;
                try {
                    userInfo = JSON.parse(userInfoStr);
                } catch (e) {
                    log('❌ 用户信息JSON格式错误', 'error');
                    return;
                }

                const message = {
                    type: 'login',
                    data: {
                        token: {
                            accessToken: accessToken,
                            refreshToken: refreshToken,
                            userInfo: userInfo
                        }
                    }
                };

                log('📤 正在发送登录消息...', 'info');
                log(`📦 消息内容: ${JSON.stringify(message, null, 2)}`, 'info');

                // 注意：这里需要替换为实际的扩展ID
                // 扩展ID可以在 chrome://extensions/ 页面找到
                const extensionId = 'YOUR_EXTENSION_ID'; // ⚠️ 需要替换

                chrome.runtime.sendMessage(
                    extensionId,
                    message,
                    function(response) {
                        if (chrome.runtime.lastError) {
                            log(`❌ 发送失败: ${chrome.runtime.lastError.message}`, 'error');
                            log('💡 提示1: 请将上面的 YOUR_EXTENSION_ID 替换为实际的扩展ID', 'info');
                            log('💡 提示2: 扩展ID可以在 chrome://extensions/ 找到', 'info');
                            log('💡 提示3: 确保此页面域名在manifest.json的externally_connectable中', 'info');
                        } else {
                            log(`✅ 消息发送成功!`, 'success');
                            log(`📦 扩展响应: ${JSON.stringify(response)}`, 'success');
                        }
                    }
                );

            } catch (error) {
                log(`❌ 发送失败: ${error.message}`, 'error');
            }
        }

        /**
         * 发送登出消息
         */
        async function sendLogoutMessage() {
            try {
                log('📤 正在发送登出消息...', 'info');

                const extensionId = 'YOUR_EXTENSION_ID'; // 需要替换

                chrome.runtime.sendMessage(
                    extensionId,
                    { type: 'logout' },
                    function(response) {
                        if (chrome.runtime.lastError) {
                            log(`❌ 发送失败: ${chrome.runtime.lastError.message}`, 'error');
                        } else {
                            log(`✅ 登出成功!`, 'success');
                            log(`📦 响应: ${JSON.stringify(response)}`, 'info');
                        }
                    }
                );
            } catch (error) {
                log(`❌ 发送失败: ${error.message}`, 'error');
            }
        }

        // 页面加载时的提示
        window.addEventListener('load', () => {
            log('📄 测试页面加载完成', 'info');
            log('⚠️ 重要: 请先修改代码中的 YOUR_EXTENSION_ID 为实际的扩展ID', 'error');
            log('💡 扩展ID获取方法: 打开 chrome://extensions/ -> 开启开发者模式 -> 查看扩展ID', 'info');
        });
    </script>
</body>
</html>

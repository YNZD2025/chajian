<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 一念职达</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/common.css">
    <style>
        .profile-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 15px; }
        .profile-avatar { width: 60px; height: 60px; border-radius: 50%; border: 3px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .profile-name { margin-top: 8px; font-size: 16px; font-weight: 700; color: var(--text-main); }
        .profile-status { font-size: 10px; color: var(--accent); border: 1px solid var(--accent); padding: 2px 8px; border-radius: 8px; margin-top: 5px; }

        .book-wrapper { position: relative; width: 100%; height: 350px; perspective: 1000px; cursor: pointer; }
        .resume-page-next { position: absolute; top: 8px; right: -10px; width: 96%; height: 100%; background: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.5); border-radius: 20px; padding: 16px; transform: rotate(3deg) translateZ(-10px); box-shadow: 2px 2px 10px rgba(0,0,0,0.05); z-index: 1; transition: transform 0.4s ease; filter: blur(1px); opacity: 0.8; overflow: hidden; }
        .resume-page-current { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; border-radius: 20px; padding: 18px; border: 1px solid rgba(0,0,0,0.05); box-shadow: -5px 10px 30px rgba(0,0,0,0.1); z-index: 2; transition: transform 0.4s ease; display: flex; flex-direction: column; }
        .book-wrapper:hover .resume-page-current { transform: translateX(-20px) rotateY(-5deg); }
        .book-wrapper:hover .resume-page-next { transform: rotate(1deg) translateZ(0); filter: blur(0); opacity: 1; }
        .switch-tooltip { position: absolute; right: -10px; top: 25px; background: var(--accent); color: white; font-size: 9px; padding: 2px 5px; border-radius: 5px; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 10; white-space: nowrap; }
        .book-wrapper:hover .switch-tooltip { opacity: 1; right: -35px; }
        .skeleton-block { height: 35px; background: #f0f0f0; border-radius: 8px; margin-bottom: 8px; }
        .skeleton-text { height: 7px; width: 60%; background: #eee; margin-bottom: 6px; border-radius: 3px; }

        .resume-section { margin-bottom: 12px; }
        .resume-section h4 { color: var(--primary); font-size: 12px; margin-bottom: 6px; }
        .resume-section .title { font-size: 12px; font-weight: 600; color: var(--text-main); margin-bottom: 2px; }
        .resume-section .subtitle { font-size: 10px; color: #999; }
        .resume-divider { height: 1px; background: #f5f5f5; margin: 10px 0; }

        .skill-tags { display: flex; flex-wrap: wrap; gap: 4px; }
        .skill-tag { font-size: 9px; background: #e0f7fa; color: var(--dark-green); padding: 2px 6px; border-radius: 5px; }

        .edit-resume-btn { margin-top: auto; border: 1px solid var(--accent); color: var(--accent); background: white; padding: 8px 0; border-radius: 18px; font-size: 11px; width: 100%; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .edit-resume-btn:hover { background: var(--accent); color: white; }
    </style>
</head>
<body>
    <div class="plugin-container">
        <div class="sidebar">
            <a href="fill.html" class="nav-item">
                <div class="nav-icon-box"><i class="fas fa-magic"></i></div>
                <div class="nav-label">填充</div>
            </a>
            <a href="history.html" class="nav-item">
                <div class="nav-icon-box"><i class="fas fa-history"></i></div>
                <div class="nav-label">记录</div>
            </a>
            <div class="sidebar-spacer"></div>
            <div class="sidebar-bottom">
                <a href="profile.html" class="nav-item active">
                    <div class="nav-icon-box"><i class="fas fa-user"></i></div>
                    <div class="nav-label">我的</div>
                </a>
                <a href="settings.html" class="nav-item">
                    <div class="nav-icon-box"><i class="fas fa-cog"></i></div>
                    <div class="nav-label">设置</div>
                </a>
            </div>
        </div>
        <div class="main-area">
            <a href="settings.html" class="liquid-close"><i class="fas fa-cog"></i></a>
            <div class="plugin-content" style="padding-top: 15px;">
                <div class="profile-header">
                    <img src="https://i.pravatar.cc/150?img=47" class="profile-avatar">
                    <div class="profile-name">李艺伟</div>
                    <div class="profile-status">求职中</div>
                </div>

                <div class="book-wrapper">
                    <div class="switch-tooltip">查看英文版</div>
                    <div class="resume-page-next">
                        <div style="text-align:right; font-size:9px; color:var(--primary); font-weight:bold;">English Resume</div>
                        <div style="margin-top:25px;">
                            <div class="skeleton-text" style="width:30%"></div>
                            <div class="skeleton-block"></div>
                        </div>
                    </div>

                    <div class="resume-page-current">
                        <div style="flex:1; overflow-y:auto; padding-right:5px; scrollbar-width:none;">
                            <div class="resume-section">
                                <h4>教育背景</h4>
                                <div class="title">清华大学 / 硕士</div>
                                <div class="subtitle">计算机科学与技术 | 2023-2026</div>
                            </div>
                            <div class="resume-divider"></div>

                            <div class="resume-section">
                                <h4>实习经历</h4>
                                <div class="title">微软亚洲研究院</div>
                                <div class="subtitle">算法实习生 | 2024.06 - 2024.09</div>
                            </div>
                            <div class="resume-divider"></div>

                            <div class="resume-section">
                                <h4>专业技能</h4>
                                <div class="skill-tags">
                                    <span class="skill-tag">Python</span>
                                    <span class="skill-tag">C++</span>
                                    <span class="skill-tag">PyTorch</span>
                                </div>
                            </div>
                            <div class="resume-divider"></div>

                            <div class="resume-section">
                                <h4>获奖经历</h4>
                                <div style="font-size:10px; color:var(--text-main);">• 国家奖学金 (2024)</div>
                            </div>
                        </div>

                        <button class="edit-resume-btn" onclick="location.href='edit-resume.html'">编辑简历</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="scripts/transitions.js"></script>
    <script src="scripts/security.js"></script>
</body>
</html>

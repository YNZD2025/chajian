spring.application.name=yinianzhida

# Server Configuration
server.port=8080

# Spring AI OpenAI Configuration
spring.ai.openai.base-url=https://g.thank.xx.kg
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-3qRffm9FV6T7mZYfqZMK3csWetGuWIrJd6jtMmxrJhNqFLx4}
spring.ai.openai.chat.options.model=claude-sonnet-4-20250514
spring.ai.openai.chat.options.temperature=0.7

# AI Request Timeout Configuration (in seconds)
# Increase timeout for complex analysis requests
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=2s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=10s

# HTTP Client Timeout (for RestClient used by Spring AI)
spring.ai.openai.connection-timeout=30s
spring.ai.openai.read-timeout=60s

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application Base URL (for image URL generation)
# Development: http://localhost:8080
# Production: Set environment variable APP_BASE_URL=http://your-server-ip:8080
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/applymind?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.nian.yinianzhida.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# JWT Configuration
jwt.secret=${JWT_SECRET:ApplyMind2024SecretKeyForJWTTokenGenerationAndValidation}
jwt.expiration=604800000
jwt.header=Authorization
jwt.prefix=Bearer

# WeChat MP Configuration
wechat.mp.appId=${WECHAT_APP_ID:wx68f8092e00a4779f}
wechat.mp.appSecret=${WECHAT_APP_SECRET:3eca7f97e99030e9c852498d61519ecd}
wechat.mp.token=${WECHAT_TOKEN:applymind_token}
wechat.mp.aesKey=${WECHAT_AES_KEY:}

# WeChat Callback URL
wechat.callback.url=${WECHAT_CALLBACK_URL:http://e64d845b.natappfree.cc/auth/wechat/callback}



# Logging Configuration
# Log file output path
logging.file.name=logs/yinianzhida.log

# Logback rolling policy configuration (Spring Boot 2.2+)
# Max log file size (single file)
logging.logback.rollingpolicy.max-file-size=10MB
# Log file retention days
logging.logback.rollingpolicy.max-history=30
# Total log size cap (all files)
logging.logback.rollingpolicy.total-size-cap=1GB

# Logging level configuration
logging.level.root=INFO
logging.level.com.nian.yinianzhida=DEBUG
logging.level.com.nian.yinianzhida.controller.AuthController=DEBUG
logging.level.com.nian.yinianzhida.service.WeChatService=DEBUG
logging.level.com.nian.yinianzhida.interceptor.JwtInterceptor=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.me.chanjar.weixin=DEBUG

# Logging output format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n
